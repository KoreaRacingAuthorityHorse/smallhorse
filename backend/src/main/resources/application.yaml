spring:
  application:
    name: smallhorse
  config:
    # backend/.env 를 읽는다. 없으면 무시
    # 실행 위치가 backend/ 이면 ./.env, 상위 폴더(smallhorse/)면 ./backend/.env
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  datasource:
    # db/docker-compose.yml 의 trackon-db (비밀번호는 backend/.env 의 DB_PASSWORD)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trackon}
    username: ${DB_USER:trackon}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            # 실제 값은 환경변수로 주입 (기본값은 기동용 더미)
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,profile,email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    # 32바이트 이상. 운영/배포 시 반드시 SMALLHORSE_JWT_SECRET 환경변수로 교체
    # (JWT_SECRET 은 다른 프로젝트와 이름이 겹칠 수 있어 프로젝트 전용 이름 사용)
    secret: ${SMALLHORSE_JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
    expiration-minutes: 60
    cookie-secure: ${JWT_COOKIE_SECURE:false}
